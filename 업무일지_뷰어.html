<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>완속충전기 업무일지</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f5f7;
      --panel: #ffffff;
      --ink: #172026;
      --muted: #66747c;
      --line: #dce3e7;
      --brand: #146b5d;
      --brand-soft: #e4f2ef;
      --accent: #e9a23b;
      --shadow: 0 10px 30px rgba(24, 42, 51, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
      background:
        radial-gradient(circle at 8% 5%, rgba(20, 107, 93, .10), transparent 28rem),
        var(--bg);
      color: var(--ink);
    }
    button, input { font: inherit; }
    .shell {
      display: grid;
      grid-template-columns: 310px minmax(0, 1fr);
      min-height: 100vh;
    }
    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 28px 22px;
      background: #102f2b;
      color: #f8fffd;
      overflow: auto;
    }
    .eyebrow {
      color: #a9d5cb;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    aside h1 { margin: 8px 0 6px; font-size: 25px; line-height: 1.25; }
    aside p { margin: 0 0 22px; color: #bdd0cc; font-size: 13px; line-height: 1.55; }
    .search {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 12px;
      outline: none;
      background: rgba(255,255,255,.08);
      color: white;
    }
    .search::placeholder { color: #a9bcb8; }
    .search:focus { border-color: #8fd0c1; box-shadow: 0 0 0 3px rgba(143,208,193,.14); }
    .nav-label { margin: 24px 4px 10px; color: #8fb0aa; font-size: 12px; font-weight: 800; }
    .date-list { display: grid; gap: 7px; }
    .date-button {
      width: 100%;
      padding: 11px 12px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: #dce9e6;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .date-button:hover, .date-button.active { background: rgba(255,255,255,.12); color: white; }
    .date-button span:last-child { color: #99b7b1; font-size: 12px; }
    main { min-width: 0; padding: 36px clamp(22px, 5vw, 72px) 64px; }
    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }
    .topbar h2 { margin: 0 0 6px; font-size: clamp(28px, 4vw, 44px); letter-spacing: -.04em; }
    .topbar p { margin: 0; color: var(--muted); }
    .badge {
      white-space: nowrap;
      padding: 9px 12px;
      border-radius: 999px;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 13px;
      font-weight: 800;
    }
    .calendar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin: 0 0 26px;
    }
    .day-card {
      min-height: 132px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease;
    }
    .day-card:hover { transform: translateY(-2px); border-color: #9dc8bf; }
    .day-card strong { display: block; color: var(--brand); font-size: 13px; }
    .day-card h3 { margin: 10px 0 6px; font-size: 16px; line-height: 1.35; }
    .day-card p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .document {
      padding: clamp(22px, 4vw, 46px);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .document h1 { margin: 0 0 24px; font-size: 30px; }
    .document h2 {
      margin: 34px 0 16px;
      padding-bottom: 9px;
      border-bottom: 2px solid var(--brand-soft);
      font-size: 21px;
    }
    .document h3 {
      margin: 26px 0 12px;
      padding: 14px 16px;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      background: #fff8ed;
      font-size: 17px;
    }
    .document p, .document li { line-height: 1.75; }
    .document ul { padding-left: 22px; }
    .document li { margin: 5px 0; }
    .table-wrap { overflow-x: auto; margin: 14px 0 24px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 12px 13px; border: 1px solid var(--line); text-align: left; vertical-align: top; line-height: 1.5; }
    th { background: #edf5f3; color: #164c43; }
    tr:nth-child(even) td { background: #fafcfc; }
    code { padding: 2px 6px; border-radius: 6px; background: #edf1f3; color: #21433d; }
    mark { padding: 0 2px; background: #ffe29d; }
    .empty { padding: 70px 20px; text-align: center; color: var(--muted); }
    .loading { animation: pulse 1.2s infinite alternate; }
    @keyframes pulse { to { opacity: .45; } }
    @media (max-width: 840px) {
      .shell { grid-template-columns: 1fr; }
      aside { position: relative; height: auto; padding: 22px; }
      .date-list { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
      main { padding-top: 24px; }
      .topbar { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="eyebrow">Work Journal</div>
      <h1>완속충전기<br>업무일지</h1>
      <p>날짜별 업무와 대화별 목적·결과를 편하게 찾아보세요.</p>
      <input id="search" class="search" type="search" placeholder="업무, 파일, 키워드 검색">
      <div class="nav-label">날짜별 기록</div>
      <nav id="dateList" class="date-list"></nav>
    </aside>
    <main>
      <header class="topbar">
        <div>
          <h2 id="pageTitle">업무 기록 모아보기</h2>
          <p id="pageSub">업무일지 파일을 불러오는 중입니다.</p>
        </div>
        <div id="countBadge" class="badge loading">불러오는 중</div>
      </header>
      <section id="calendar" class="calendar"></section>
      <article id="document" class="document">
        <div class="empty loading">업무일지를 준비하고 있습니다.</div>
      </article>
    </main>
  </div>

  <script>
    const state = { docs: [], selected: null, query: "" };
    const $ = (id) => document.getElementById(id);
    const escapeHtml = (value) => String(value)
      .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");

    function inline(text) {
      return escapeHtml(text)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }

    function renderMarkdown(md) {
      const lines = md.replace(/\r/g, "").split("\n");
      let html = "", inList = false, inTable = false, tableRows = [];
      const closeList = () => { if (inList) { html += "</ul>"; inList = false; } };
      const flushTable = () => {
        if (!inTable) return;
        const rows = tableRows.filter((_, i) => i !== 1);
        html += '<div class="table-wrap"><table>';
        rows.forEach((row, i) => {
          const cells = row.split("|").slice(1, -1);
          const tag = i === 0 ? "th" : "td";
          html += "<tr>" + cells.map(c => `<${tag}>${inline(c.trim())}</${tag}>`).join("") + "</tr>";
        });
        html += "</table></div>";
        tableRows = []; inTable = false;
      };
      for (const raw of lines) {
        const line = raw.trimEnd();
        if (line.startsWith("|") && line.endsWith("|")) {
          closeList(); inTable = true; tableRows.push(line); continue;
        }
        flushTable();
        if (!line.trim()) { closeList(); continue; }
        if (line.startsWith("### ")) { closeList(); html += `<h3>${inline(line.slice(4))}</h3>`; }
        else if (line.startsWith("## ")) { closeList(); html += `<h2>${inline(line.slice(3))}</h2>`; }
        else if (line.startsWith("# ")) { closeList(); html += `<h1>${inline(line.slice(2))}</h1>`; }
        else if (line.startsWith("- ")) {
          if (!inList) { html += "<ul>"; inList = true; }
          html += `<li>${inline(line.slice(2))}</li>`;
        } else {
          closeList(); html += `<p>${inline(line)}</p>`;
        }
      }
      flushTable(); closeList();
      return html;
    }

    function summaryFrom(md) {
      const rows = md.split("\n").filter(line => /^\|\s*\d+\s*\|/.test(line));
      if (rows.length) {
        const cells = rows[0].split("|").map(x => x.trim()).filter(Boolean);
        return { title: cells[1] || "업무 기록", status: cells[2] || "", detail: cells[3] || "" };
      }
      const heading = md.match(/^###\s+(.+)$/m);
      return { title: heading?.[1] || "업무 기록", status: "", detail: "" };
    }

    function searchable(doc) {
      return `${doc.name}\n${doc.text}`.toLowerCase().includes(state.query.toLowerCase());
    }

    function displayName(name) {
      if (name.includes("종합")) return "종합 업무일지";
      return name.replace(".md", "");
    }

    function renderNav() {
      const visible = state.docs.filter(searchable);
      $("dateList").innerHTML = visible.map(doc => `
        <button class="date-button ${state.selected === doc.name ? "active" : ""}" data-name="${escapeHtml(doc.name)}">
          <span>${escapeHtml(displayName(doc.name))}</span>
          <span>${doc.text.match(/^### /gm)?.length || 0}건</span>
        </button>`).join("");
      document.querySelectorAll(".date-button").forEach(button =>
        button.addEventListener("click", () => selectDoc(button.dataset.name)));
    }

    function renderCalendar() {
      const visible = state.docs.filter(doc => !doc.name.includes("종합") && searchable(doc));
      $("calendar").innerHTML = visible.map(doc => {
        const s = summaryFrom(doc.text);
        return `<button class="day-card" data-name="${escapeHtml(doc.name)}">
          <strong>${escapeHtml(displayName(doc.name))}</strong>
          <h3>${inline(s.title)}</h3>
          <p>${inline(s.detail || s.status || "상세 업무 기록 보기")}</p>
        </button>`;
      }).join("");
      document.querySelectorAll(".day-card").forEach(button =>
        button.addEventListener("click", () => selectDoc(button.dataset.name)));
    }

    function highlight(html, query) {
      if (!query) return html;
      const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return html.replace(new RegExp(`(>[^<]*)(${escaped})`, "gi"), (_, prefix, hit) =>
        `${prefix}<mark>${hit}</mark>`);
    }

    function selectDoc(name) {
      const doc = state.docs.find(item => item.name === name);
      if (!doc) return;
      state.selected = name;
      $("pageTitle").textContent = displayName(name);
      $("pageSub").textContent = name.includes("종합") ? "전체 기간의 핵심 업무를 한 번에 확인합니다." : "날짜별 대화와 업무 결과를 확인합니다.";
      $("document").innerHTML = highlight(renderMarkdown(doc.text), state.query);
      renderNav();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function loadDocs() {
      const directory = await fetch("./업무일지/");
      const listing = await directory.text();
      const holder = document.createElement("div");
      holder.innerHTML = listing;
      const names = [...holder.querySelectorAll("a")]
        .map(a => decodeURIComponent(a.getAttribute("href") || "").split("/").pop())
        .filter(name => name?.toLowerCase().endsWith(".md"));
      const docs = await Promise.all(names.map(async name => ({
        name,
        text: await (await fetch(`./업무일지/${encodeURIComponent(name)}`)).text()
      })));
      state.docs = docs.sort((a, b) => {
        if (a.name.includes("종합")) return -1;
        if (b.name.includes("종합")) return 1;
        return b.name.localeCompare(a.name);
      });
      $("countBadge").classList.remove("loading");
      $("countBadge").textContent = `${state.docs.length}개 문서`;
      $("pageSub").textContent = "달력에서 날짜를 고르거나 키워드로 검색하세요.";
      renderNav(); renderCalendar();
      const first = state.docs.find(doc => doc.name.includes("종합")) || state.docs[0];
      if (first) selectDoc(first.name);
      else $("document").innerHTML = '<div class="empty">표시할 업무일지가 없습니다.</div>';
    }

    $("search").addEventListener("input", (event) => {
      state.query = event.target.value.trim();
      renderNav(); renderCalendar();
      const current = state.docs.find(doc => doc.name === state.selected);
      if (current) $("document").innerHTML = highlight(renderMarkdown(current.text), state.query);
    });

    loadDocs().catch(error => {
      $("countBadge").classList.remove("loading");
      $("countBadge").textContent = "연결 필요";
      $("document").innerHTML = `<div class="empty"><strong>업무일지를 불러오지 못했습니다.</strong><br><br>업무일지_뷰어_실행.cmd를 사용해 다시 열어주세요.</div>`;
      console.error(error);
    });
  </script>
</body>
</html>
